name: Windows source build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-source.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: UCRT64 all targets and isolated tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the UCRT64 build dependencies
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-boost

      - name: Install pinned updater test dependencies
        shell: pwsh
        run: |
          python -m venv .ci-python
          if ($LASTEXITCODE -ne 0) { throw "Python test environment creation failed" }
          & ./.ci-python/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/requirements-updater.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned updater test dependencies failed" }

      - name: Record the actual tool versions
        run: |
          g++ --version
          cmake --version
          ninja --version
          pacman -Q mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-gmp

      - name: Configure a clean Release tree
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/.ci-python/Scripts/python.exe"

      - name: Build every default source target
        run: |
          pgn_build_jobs="$(nproc)"
          if [ "$pgn_build_jobs" -gt 4 ]; then pgn_build_jobs=4; fi
          printf 'Build workers: %s\n' "$pgn_build_jobs"
          cmake --build build-ci --parallel "$pgn_build_jobs"

      - name: Run the isolated registered tests
        env:
          QT_QPA_PLATFORM: offscreen
          GSETTINGS_BACKEND: memory
        run: ctest --test-dir build-ci --output-on-failure --timeout 180 -j2

      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-source-tests-${{ github.run_id }}
          path: |
            build-ci/Testing/Temporary/LastTest.log
            build-ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7

  native-core:
    name: Native Core and authenticated audit-credit replay
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long paths on the disposable runner
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libevent
      - name: Configure the actual native daemon and wallet
        run: cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF
      - name: Rebuild every native translation unit
        run: cmake --build build-native --parallel 2 --target riecoind riecoin-cli pgn-native-audit-replay-test pgn-native-script-work-cache-test pgn-native-bootstrap-dispatch-test
      - name: Check signed credit replay, forks, budgets and context-bound verification
        run: |
          build-native/bin/pgn-native-audit-replay-test.exe "$PWD/build-native/native-fixture"
          build-native/bin/pgn-native-script-work-cache-test.exe
          build-native/bin/pgn-native-bootstrap-dispatch-test.exe
          build-native/bin/riecoind.exe --version
      - name: Collect the complete native runtime from this runner
        run: cmake -DPGN_CORE_EXECUTABLE="$PWD/build-native/bin/riecoind.exe" -DPGN_RUNTIME_SEARCH_DIR="$MINGW_PREFIX/bin" -DPGN_OUTPUT_ROOT="$PWD/native-artifact" -P cmake/CollectNativeCoreRuntime.cmake
      - name: Preserve the qualified native Windows runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-core-windows-${{ github.sha }}
          path: native-artifact/
          if-no-files-found: error
          retention-days: 7
