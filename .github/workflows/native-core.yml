name: Native PGN Core builds

on:
  push:
    branches: [main]
    paths: ['wallet/riecoin-core-upstream-v2606/**', '.github/workflows/native-core.yml']
  pull_request:
    paths: ['wallet/riecoin-core-upstream-v2606/**', '.github/workflows/native-core.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: true

jobs:

  native-windows:
    name: Native windows Core and identity
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long paths on the disposable runner
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libevent
      - name: Configure the actual native daemon and wallet
        run: cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF
      - name: Rebuild every native translation unit
        run: cmake --build build-native --parallel 2 --target pgn-native-hourly-consensus-quote-test pgn-native-hourly-consensus-math-test riecoind riecoin-cli pgn-native-audit-replay-test pgn-native-script-work-cache-test pgn-native-bootstrap-dispatch-test pgn-native-project-identity-test pgn-native-leaderboard-test pgn-native-audit-selector-test pgn-native-hourly-complete-returns-test
      - name: Check signed credit replay, forks, budgets and context-bound verification
        run: |
          build-native/bin/pgn-native-audit-replay-test.exe "$PWD/build-native/native-fixture"
          build-native/bin/pgn-native-script-work-cache-test.exe
          build-native/bin/pgn-native-audit-selector-test.exe
          build-native/bin/pgn-native-bootstrap-dispatch-test.exe
          build-native/bin/pgn-native-leaderboard-test.exe "$PWD/build-native/leaderboard-fixture"
          build-native/bin/pgn-native-hourly-complete-returns-test.exe "$PWD/build-native/hourly-complete-fixture"
          build-native/bin/pgn-native-hourly-consensus-math-test.exe
          build-native/bin/pgn-native-hourly-consensus-quote-test.exe "$PWD/build-native/hourly-consensus-fixture"
          build-native/bin/riecoind.exe --version
      - name: Verify the compiled peer identity
        run: |
          build-native/bin/pgn-native-project-identity-test.exe
          build-native/bin/riecoind.exe --version | grep '^PGN Core daemon version '
      - name: Verify Windows firewall and file properties
        shell: pwsh
        run: |
          $info = (Get-Item -LiteralPath 'build-native/bin/riecoind.exe').VersionInfo
          if ($info.FileDescription -notlike 'PGN Core*' -or $info.ProductName -ne 'PGN Core' -or $info.InternalName -ne 'pgn-core' -or $info.OriginalFilename -ne 'pgn-core.exe') { throw 'Native Windows project identity mismatch' }
          if ($info.LegalCopyright -notmatch 'Riecoin') { throw 'Upstream copyright was lost' }
      - name: Collect the native program and its actual DLL closure
        run: |
          mkdir -p native-artifact
          cp build-native/bin/riecoind.exe native-artifact/pgn-core.exe
          ldd build-native/bin/riecoind.exe > native-artifact/dependencies.txt
          if grep -q 'not found' native-artifact/dependencies.txt; then exit 1; fi
          awk '/=> \/ucrt64\/bin\// {print $3}' native-artifact/dependencies.txt | while read -r dep; do cp "$dep" native-artifact/; done
      - name: Run the collected Windows program without the build-tool DLL path
        shell: pwsh
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & './native-artifact/pgn-core.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'Collected native DLL closure is incomplete' }
      - name: Verify cold native genesis and wallet crash recovery
        shell: pwsh
        run: python tests/native_genesis_crash_recovery.py --core native-artifact/pgn-core.exe --expected-version 2026.11.13.18 --report build-native/genesis-crash.json
      - name: Verify delayed native peer handshake and extreme VERSION times
        shell: pwsh
        run: python tests/native_peer_clock_latency.py --core native-artifact/pgn-core.exe --expected-version 2026.11.13.18 --report build-native/peer-clock.json
      - name: Preserve the exact qualified native programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-core-windows-${{ github.run_id }}
          path: native-artifact
          if-no-files-found: error
          retention-days: 7

  native-ubuntu:
    name: Native ubuntu Core and identity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native daemon dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build libgmp-dev libsqlite3-dev libboost-dev libevent-dev pkg-config
      - name: Configure the actual native daemon and wallet
        run: cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF '-DCMAKE_BUILD_RPATH=$ORIGIN'
      - name: Rebuild every native translation unit
        run: cmake --build build-native --parallel 2 --target pgn-native-hourly-consensus-quote-test pgn-native-hourly-consensus-math-test riecoind riecoin-cli pgn-native-audit-replay-test pgn-native-script-work-cache-test pgn-native-bootstrap-dispatch-test pgn-native-project-identity-test pgn-native-leaderboard-test pgn-native-audit-selector-test pgn-native-hourly-complete-returns-test
      - name: Check signed credit replay, forks, budgets and context-bound verification
        run: |
          build-native/bin/pgn-native-audit-replay-test "$PWD/build-native/native-fixture"
          build-native/bin/pgn-native-script-work-cache-test
          build-native/bin/pgn-native-audit-selector-test
          build-native/bin/pgn-native-bootstrap-dispatch-test
          build-native/bin/pgn-native-leaderboard-test "$PWD/build-native/leaderboard-fixture"
          build-native/bin/pgn-native-hourly-complete-returns-test "$PWD/build-native/hourly-complete-fixture"
          build-native/bin/pgn-native-hourly-consensus-math-test
          build-native/bin/pgn-native-hourly-consensus-quote-test "$PWD/build-native/hourly-consensus-fixture"
          build-native/bin/riecoind --version
      - name: Verify the compiled peer identity
        run: |
          build-native/bin/pgn-native-project-identity-test
          build-native/bin/riecoind --version | grep '^PGN Core daemon version '
      - name: Collect the native program and dependency description
        run: |
          mkdir -p native-artifact
          cp build-native/bin/riecoind native-artifact/pgn-core
          ldd build-native/bin/riecoind > native-artifact/dependencies.txt
          if grep -q 'not found' native-artifact/dependencies.txt; then exit 1; fi
      - name: Verify cold native genesis and wallet crash recovery
        run: python3 tests/native_genesis_crash_recovery.py --core native-artifact/pgn-core --expected-version 2026.11.13.18 --report build-native/genesis-crash.json
      - name: Verify delayed native peer handshake and extreme VERSION times
        run: python3 tests/native_peer_clock_latency.py --core native-artifact/pgn-core --expected-version 2026.11.13.18 --report build-native/peer-clock.json
      - name: Preserve the exact qualified native programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-core-ubuntu-${{ github.run_id }}
          path: native-artifact
          if-no-files-found: error
          retention-days: 7
