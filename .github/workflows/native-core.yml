name: Native hourly Ubuntu existing-chain qualification218
on:
  workflow_dispatch:
    inputs:
      fixture_url:
        description: Temporary read-only URL for public chain fixture
        required: true
        type: string
      fixture_sha256:
        description: Exact fixture archive digest
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-hourly-existing-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the native runtime OS dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libevent-dev libgmp-dev libsqlite3-dev
      - name: Download the already qualified corrected native ELF
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download 43593247290 --name native-hourly-fixture-ubuntu-43593247290 --dir runtime
      - name: Verify closed chain, cold hourly startup and native branch restore
        run: python3 tools/qualify_hourly_ci_snapshot.py
      - name: Preserve bounded witness
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hourly-existing-ubuntu218-${{ github.run_id }}
          path: |
            hourly218-result/RESULT.json
            hourly218-result/DOWNLOAD-PROOF.json
            hourly218-result/FAILURE-TRACE.json
            hourly218-result/METRICS-BEFORE.json
            hourly218-result/node-*.log
          if-no-files-found: error
          retention-days: 2
