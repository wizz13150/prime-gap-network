name: Native PGN Core SDK
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c34e8d0479235006af109417c924f5b2d95eaca
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libevent
      - name: Configure exact Core18 source
        run: cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF
      - name: Build daemon libraries and native checks
        id: native_build
        run: cmake --build build-native --parallel 2 --target riecoind pgn-native-audit-replay-test pgn-native-project-identity-test
      - name: Check source and native identity
        id: native_check
        run: |
          test "$(git rev-parse HEAD)" = "6c34e8d0479235006af109417c924f5b2d95eaca"
          build-native/bin/riecoind.exe --version | grep '^PGN Core daemon version '
          build-native/bin/pgn-native-project-identity-test.exe
          build-native/bin/pgn-native-audit-replay-test.exe "$PWD/build-native/sdk-native-fixture"
      - name: Collect only source, archives and generated build interfaces
        if: always() && steps.native_build.outcome == 'success'
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,subprocess,tarfile
          root=Path.cwd();pin='6c34e8d0479235006af109417c924f5b2d95eaca'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==pin
          source=root/'wallet/riecoin-core-upstream-v2606';build=root/'build-native'
          files={}
          for name in subprocess.check_output(['git','ls-files','--','wallet/riecoin-core-upstream-v2606']).decode().splitlines():
              f=root/name
              if f.is_file():files['source/'+f.relative_to(source).as_posix()]=f
          for f in build.rglob('*'):
              if not f.is_file():continue
              rel=f.relative_to(build).as_posix()
              if f.suffix in ('.a','.h','.hpp','.cmake')or rel in ('CMakeCache.txt','compile_commands.json','build.ninja'):
                  files['build/'+rel]=f
          assert any(n.endswith('/libriecoin_node.a')for n in files)
          assert any('config/bitcoin-config.h'in n for n in files)
          rows=[dict(path=n,bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest())for n,f in sorted(files.items())]
          manifest=dict(source=pin,core_tree='0fa700b9cf47f1629cfd7ff38a6ec9b1de284ea7',files=rows,validation_outcome='${{ steps.native_check.outcome }}',contains_user_wallet_data=False,contains_user_secrets=False,scope='Read-only development SDK; never a runtime update payload; failed checks must be resolved before reuse')
          Path('SDK-MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with tarfile.open('native18-sdk.tar.gz','w:gz',compresslevel=1)as z:
              for n,f in sorted(files.items()):z.add(f,arcname=n,recursive=False)
              z.add('SDK-MANIFEST.json',arcname='SDK-MANIFEST.json')
          out=Path('native18-sdk.tar.gz');print(json.dumps(dict(PASS=True,source=pin,files=len(rows),bytes=out.stat().st_size,sha256=hashlib.sha256(out.read_bytes()).hexdigest())))
          '@ | python -I -
      - name: Preserve one-day SDK artifact
        if: always() && steps.native_build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native18-sdk-windows-${{ github.run_id }}
          path: |
            native18-sdk.tar.gz
            SDK-MANIFEST.json
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
