name: UI150 actual Ubuntu public updater
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Obtain the pinned existing public136 updater
        run: curl --fail --location --retry 2 --output portable.tar.gz https://github.com/wizz13150/prime-gap-network/releases/download/horizon-testnet/PGN-Horizon-testnet-Ubuntu-x86_64.tar.gz
      - name: Run the actual frozen26 client against the published138 catalogue
        run: python3 -I tools/qualify_public_linux150.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public138-linux-client
          path: PUBLIC138-LINUX.json
          if-no-files-found: error
          retention-days: 7
