name: Ubuntu source build

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', 'cmake/**', 'CMakeLists.txt', '.github/workflows/ubuntu-source.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build qt6-base-dev libqt6sql6-sqlite libgmp-dev libsqlite3-dev zlib1g-dev libboost-dev
      - name: Record the actual toolchain
        run: |
          g++ --version
          cmake --version
          ninja --version
          dpkg-query -W qt6-base-dev libgmp-dev libsqlite3-dev
      - name: Configure from a fresh checkout
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build every default target
        run: cmake --build build-ci --parallel 2
      - name: Run registered isolated tests
        env:
          QT_QPA_PLATFORM: offscreen
          GSETTINGS_BACKEND: memory
        run: ctest --test-dir build-ci --output-on-failure --timeout 180 -j2
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu-source-tests-${{ github.run_id }}
          path: |
            build-ci/Testing/Temporary/LastTest.log
            build-ci/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7

  native-core:
    name: Native Core and authenticated audit-credit replay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native daemon dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build libgmp-dev libsqlite3-dev libboost-dev libevent-dev pkg-config
      - name: Configure the actual native daemon and wallet
        run: cmake -S wallet/riecoin-core-upstream-v2606 -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DWITH_USDT=OFF
      - name: Rebuild every native translation unit
        run: cmake --build build-native --parallel 2 --target riecoind riecoin-cli pgn-native-audit-replay-test pgn-native-script-work-cache-test pgn-native-bootstrap-dispatch-test
      - name: Check signed credit replay, forks, budgets and context-bound verification
        run: |
          build-native/bin/pgn-native-audit-replay-test "$PWD/build-native/native-fixture"
          build-native/bin/pgn-native-script-work-cache-test
          build-native/bin/pgn-native-bootstrap-dispatch-test
          build-native/bin/riecoind --version
